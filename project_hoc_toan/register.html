<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký Tài Khoản Mới</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-body">

    <div class="auth-card">
        <a href="index.html" class="home-link"><i class="fas fa-arrow-left"></i> Quay lại trang chủ</a>
        
        <h2><i class="fas fa-user-plus"></i> Đăng Ký</h2>
        <p style="margin-bottom: 20px; color: #666;">Tạo tài khoản để bắt đầu học ngay!</p>

        <form action="register_submit.php" method="POST">
            
            <div class="form-group">
                <label>Tên đăng nhập của bé:</label>
                <input type="text" name="username" class="form-control" placeholder="Ví dụ: bi_ngoan_123" required>
            </div>

            <div class="form-group">
                <label>Mật khẩu:</label>
                <input type="password" name="password" class="form-control" placeholder="Nhập mật khẩu bí mật" required>
            </div>

            <div class="form-group">
                <label>Bạn là ai?</label>
                <select name="role" class="form-control" required>
                    <option value="" disabled selected>-- Chọn vai trò --</option>
                    <option value="student">🎓 Em là Học Sinh</option>
                    <option value="teacher">👩‍🏫 Tôi là Giáo Viên</option>
                    <option value="parent">👨‍👩‍👧‍👦 Tôi là Phụ Huynh</option>
                </select>
            </div>

            <button type="submit" class="btn btn-kid-primary btn-full pulse-animation">
                Hoàn Tất Đăng Ký
            </button>
        </form>

        <div class="auth-footer">
            Đã có tài khoản rồi? <a href="login.html">Đăng nhập tại đây</a>
        </div>
    </div>

</body>
</html>
