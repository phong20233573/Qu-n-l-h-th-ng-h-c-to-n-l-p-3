<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập - Toán Lớp 3</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-body">

    <div class="auth-card">
        <a href="index.php" class="home-link"><i class="fas fa-arrow-left"></i> Quay lại trang chủ</a>
        
        <div style="font-size: 50px; color: var(--kid-blue); margin-bottom: 10px;">
            <i class="fas fa-user-astronaut"></i>
        </div>

        <h2>Chào Mừng Trở Lại!</h2>

        <form action="login_submit.php" method="POST">
            <div class="form-group">
                <label>Tên đăng nhập:</label>
                <input type="text" name="username" class="form-control" placeholder="Nhập tên của bạn" required>
            </div>

            <div class="form-group">
                <label>Mật khẩu:</label>
                <input type="password" name="password" class="form-control" placeholder="********" required>
            </div>

            <button type="submit" class="btn btn-kid-primary btn-full">
                Vào Lớp Học <i class="fas fa-sign-in-alt"></i>
            </button>
        </form>

        <div class="auth-footer">
            Chưa có tài khoản? <a href="register.html">Đăng ký ngay</a>
        </div>
    </div>

</body>
</html>
